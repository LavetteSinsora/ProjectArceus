[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-world-model"
version = "0.1.0"
description = "JEPA world model + policy for ARC-AGI LS20"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arc-agi>=0.9.8",
    "arcengine>=0.9.3",
    "torch>=2.0",
    "numpy>=1.24",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # required by FastAPI TestClient
]

[project.scripts]
jepa-train     = "JEPA.experiments.exp_001_vit_jepa_baseline.train:main"
jepa-eval      = "JEPA.experiments.exp_001_vit_jepa_baseline.eval:main"
jepa-dashboard = "JEPA.dashboard.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["JEPA*"]
